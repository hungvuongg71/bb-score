<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Basketball Scoreboard</title>
  <style>
    :root {
      --bg: #000;
      --panel: #0a0a0a;
      --line: #ff7a38;
      --text: #ffd9c6;
      --score: #ff9c62;
      --timer: #ffe25e;
      --danger: #ff2424;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top, #141414 0%, var(--bg) 55%);
      color: var(--text);
      font-family: "Courier New", Courier, monospace;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      padding: 1.5vh 1.5vw;
    }

    .scoreboard {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr auto 1fr auto;
      gap: 1.4vh;
    }

    .panel {
      background: linear-gradient(160deg, #121212, var(--panel));
      border: 2px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 0 16px rgba(255, 91, 31, 0.28), inset 0 0 22px rgba(255, 91, 31, 0.12);
    }

    .team-card {
      padding: 1.6vh 1.2vw;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 1.1vh;
    }

    .team-name {
      width: 100%;
      border: 1px solid rgba(255, 122, 56, 0.85);
      border-radius: 12px;
      background: #050505;
      color: var(--text);
      text-transform: uppercase;
      text-align: center;
      padding: 1.1vh 1vw;
      font-size: clamp(16px, 2.3vw, 30px);
      letter-spacing: 0.08em;
      font-weight: 700;
    }

    .team-name:focus,
    .btn:focus-visible,
    .time-input:focus {
      outline: 2px solid #ff5b1f;
      outline-offset: 2px;
    }

    .score {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(76px, 22vw, 220px);
      line-height: 1;
      color: var(--score);
      text-shadow: 0 0 10px rgba(255, 91, 31, 0.9), 0 0 24px rgba(255, 91, 31, 0.75), 0 0 38px rgba(255, 91, 31, 0.58);
      user-select: none;
    }

    .score-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1vh;
    }

    .center-panel {
      padding: 1.4vh 1.1vw;
      display: grid;
      gap: 1vh;
      align-content: center;
    }

    .timer-display {
      text-align: center;
      font-size: clamp(48px, 10vw, 116px);
      color: var(--timer);
      letter-spacing: 0.08em;
      text-shadow: 0 0 8px rgba(255, 226, 94, 0.82), 0 0 20px rgba(255, 226, 94, 0.6);
      user-select: none;
    }

    .timer-set {
      display: grid;
      grid-template-columns: 1fr;
    }

    .time-input {
      min-height: 6.5vh;
      border: 1px solid rgba(255, 122, 56, 0.85);
      border-radius: 10px;
      background: #050505;
      color: var(--text);
      text-align: center;
      font-size: clamp(16px, 2.1vw, 26px);
      font-family: inherit;
      font-weight: 700;
    }

    .time-label {
      font-size: clamp(14px, 1.6vw, 18px);
      color: #ffd4be;
    }

    .time-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1vh;
    }

    .time-field {
      display: grid;
      gap: 0.5vh;
    }

    .timer-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1vh;
    }

    .btn {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: linear-gradient(180deg, #272727, #0d0d0d);
      color: var(--text);
      font-family: inherit;
      font-size: clamp(16px, 2.2vw, 28px);
      font-weight: 700;
      min-height: 7vh;
      cursor: pointer;
      text-shadow: 0 0 8px rgba(255, 91, 31, 0.5);
      box-shadow: 0 0 10px rgba(255, 91, 31, 0.16);
      transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
      padding: 0.5em 0.3em;
    }

    .btn:hover {
      border-color: #ff5b1f;
      box-shadow: 0 0 14px rgba(255, 91, 31, 0.42);
    }

    .btn:active { transform: translateY(1px) scale(0.99); }

    .timer-btn {
      border-color: #e5b900;
      color: #fff3bb;
      text-shadow: 0 0 8px rgba(255, 226, 94, 0.52);
      box-shadow: 0 0 10px rgba(255, 226, 94, 0.2);
    }

    .whistle-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1vh;
    }

    .whistle-btn {
      min-height: 8.8vh;
      font-size: clamp(16px, 2.1vw, 28px);
    }

    .whistle-play-btn {
      border-color: #ff7a38;
      color: #ffe5d8;
      background: linear-gradient(180deg, #5f2700, #2a1300);
      box-shadow: 0 0 16px rgba(255, 122, 56, 0.34);
    }

    .whistle-toggle-btn {
      border-color: var(--danger);
      color: #ffe5e5;
      background: linear-gradient(180deg, #5a0000, #260000);
      text-shadow: 0 0 10px rgba(255, 36, 36, 0.65);
      box-shadow: 0 0 16px rgba(255, 36, 36, 0.34);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 2vh 2vw;
      z-index: 20;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .timer-modal {
      width: min(92vw, 420px);
      border: 2px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(160deg, #151515, #080808);
      box-shadow: 0 0 22px rgba(255, 91, 31, 0.32);
      padding: 1.5vh 1.2vw;
      display: grid;
      gap: 1.2vh;
    }

    .modal-title {
      margin: 0;
      text-align: center;
      letter-spacing: 0.06em;
      font-size: clamp(18px, 2.3vw, 26px);
      color: #ffe2d2;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1vh;
    }

    .footer-actions {
      display: grid;
      grid-template-columns: 1fr;
      max-width: 520px;
      margin: 0 auto;
      width: 100%;
    }

    .reset-btn {
      border-color: var(--danger);
      color: #ffd0d0;
      text-shadow: 0 0 10px rgba(255, 58, 58, 0.5);
      box-shadow: 0 0 14px rgba(255, 58, 58, 0.22);
      min-height: 8vh;
    }

    @media (orientation: landscape) {
      .scoreboard {
        grid-template-columns: 1fr minmax(280px, 30vw) 1fr;
        grid-template-rows: 1fr auto;
        gap: 1.5vw;
      }

      .home-team { grid-column: 1; grid-row: 1; }
      .center-panel { grid-column: 2; grid-row: 1; }
      .away-team { grid-column: 3; grid-row: 1; }

      .footer-actions {
        grid-column: 1 / -1;
        grid-row: 2;
      }

      .score { font-size: clamp(80px, 16vw, 220px); }
      .timer-display { font-size: clamp(56px, 7vw, 108px); }
      .btn { min-height: 9vh; font-size: clamp(16px, 1.6vw, 24px); }
    }
  </style>
</head>
<body>
  <main class="scoreboard" aria-label="Bảng điểm bóng rổ">
    <section class="panel team-card home-team" aria-label="Đội nhà">
      <input id="home-name" class="team-name" type="text" maxlength="18" value="HOME" aria-label="Tên đội nhà" />
      <div id="home-score" class="score" aria-live="polite">0</div>
      <div class="score-actions" role="group" aria-label="Nút cộng điểm đội nhà">
        <button class="btn" data-team="home" data-points="1" type="button">+1</button>
        <button class="btn" data-team="home" data-points="2" type="button">+2</button>
        <button class="btn" data-team="home" data-points="3" type="button">+3</button>
      </div>
    </section>

    <section class="panel center-panel" aria-label="Đồng hồ và còi">
      <div id="timer-display" class="timer-display" aria-live="polite">00:00</div>
      <div class="timer-set" aria-label="Thiết lập thời gian">
        <button id="open-timer-modal-btn" class="btn timer-btn" type="button">SET TIMER</button>
      </div>
      <div class="timer-controls" role="group" aria-label="Điều khiển đồng hồ">
        <button id="toggle-timer-btn" class="btn timer-btn" type="button">START</button>
        <button id="reset-timer-btn" class="btn timer-btn" type="button">RESET TIMER</button>
      </div>
      <div class="whistle-actions" role="group" aria-label="Nút còi trọng tài">
        <button id="whistle-play-btn" class="btn whistle-btn whistle-play-btn" type="button">WHISTLE PLAY</button>
        <button id="whistle-toggle-btn" class="btn whistle-btn whistle-toggle-btn" type="button">WHISTLE TOGGLE</button>
      </div>
    </section>

    <section class="panel team-card away-team" aria-label="Đội khách">
      <input id="away-name" class="team-name" type="text" maxlength="18" value="AWAY" aria-label="Tên đội khách" />
      <div id="away-score" class="score" aria-live="polite">0</div>
      <div class="score-actions" role="group" aria-label="Nút cộng điểm đội khách">
        <button class="btn" data-team="away" data-points="1" type="button">+1</button>
        <button class="btn" data-team="away" data-points="2" type="button">+2</button>
        <button class="btn" data-team="away" data-points="3" type="button">+3</button>
      </div>
    </section>

    <div class="footer-actions">
      <button id="reset-score-btn" class="btn reset-btn" type="button">RESET SCORE</button>
    </div>
  </main>

  <div id="timer-modal-backdrop" class="modal-backdrop" role="presentation">
    <div id="timer-modal" class="timer-modal" role="dialog" aria-modal="true" aria-labelledby="timer-modal-title">
      <h2 id="timer-modal-title" class="modal-title">SET TIMER</h2>
      <div class="time-grid">
        <label class="time-field">
          <span class="time-label">Phút</span>
          <input id="minutes-input" class="time-input" type="number" min="0" max="99" placeholder="10" aria-label="Phút" />
        </label>
      </div>
      <div class="modal-actions">
        <button id="cancel-timer-btn" class="btn" type="button">HỦY</button>
        <button id="set-timer-btn" class="btn timer-btn" type="button">LƯU</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "bbs_state_v3";
    const WHISTLE_AUDIO_DATA_URI = "data:audio/wav;base64,UklGRl4AAABXQVZFZm10IBAAAAABAAEAIlYAAESsAAACABAAZGF0YToAAAAAABQUFRUVFRUVFRUWFhYWFhUVFRUVFRUWFhYWFhUVFRUVFRUVFRUVFRUWFhYWFhUVFRUVFRUVFRUVFRUVFRUVFRU=";
    const homeNameInput = document.getElementById("home-name");
    const awayNameInput = document.getElementById("away-name");
    const homeScoreElement = document.getElementById("home-score");
    const awayScoreElement = document.getElementById("away-score");
    const timerDisplayElement = document.getElementById("timer-display");
    const openTimerModalButton = document.getElementById("open-timer-modal-btn");
    const minutesInput = document.getElementById("minutes-input");
    const timerModalBackdrop = document.getElementById("timer-modal-backdrop");
    const timerModal = document.getElementById("timer-modal");
    const cancelTimerButton = document.getElementById("cancel-timer-btn");
    const setTimerButton = document.getElementById("set-timer-btn");
    const toggleTimerButton = document.getElementById("toggle-timer-btn");
    const resetTimerButton = document.getElementById("reset-timer-btn");
    const whistlePlayButton = document.getElementById("whistle-play-btn");
    const whistleToggleButton = document.getElementById("whistle-toggle-btn");
    const resetScoreButton = document.getElementById("reset-score-btn");

    const whistleAudio = new Audio(WHISTLE_AUDIO_DATA_URI);
    whistleAudio.preload = "auto";

    let tickIntervalId = null;
    let audioContext = null;

    const state = {
      homeName: "HOME",
      awayName: "AWAY",
      homeScore: 0,
      awayScore: 0,
      timerInitialSeconds: 0,
      timerRemainingSeconds: 0,
      timerRunning: false,
      timerEndAt: null,
      timerConfigured: false,
    };

    function loadState() {
      const rawValue = localStorage.getItem(STORAGE_KEY);
      if (!rawValue) return;

      try {
        const parsed = JSON.parse(rawValue);
        state.homeName = (parsed.homeName || "HOME").toString().slice(0, 18);
        state.awayName = (parsed.awayName || "AWAY").toString().slice(0, 18);
        state.homeScore = Math.max(0, Number(parsed.homeScore) || 0);
        state.awayScore = Math.max(0, Number(parsed.awayScore) || 0);
        state.timerInitialSeconds = Math.max(0, Number(parsed.timerInitialSeconds) || 0);
        state.timerRemainingSeconds = Math.max(0, Number(parsed.timerRemainingSeconds) || 0);
        state.timerRunning = Boolean(parsed.timerRunning);
        state.timerEndAt = Number(parsed.timerEndAt) || null;
        state.timerConfigured = Boolean(parsed.timerConfigured) && state.timerInitialSeconds > 0;
      } catch (_) {
        localStorage.removeItem(STORAGE_KEY);
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function formatTimer(totalSeconds) {
      const safeSeconds = Math.max(0, Math.floor(totalSeconds));
      const minutes = Math.floor(safeSeconds / 60);
      const seconds = safeSeconds % 60;
      return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
    }

    function sanitizeTeamName(name, fallbackName) {
      const trimmed = name.trim().slice(0, 18);
      return trimmed || fallbackName;
    }

    function render() {
      homeNameInput.value = state.homeName;
      awayNameInput.value = state.awayName;
      homeScoreElement.textContent = state.homeScore;
      awayScoreElement.textContent = state.awayScore;
      timerDisplayElement.textContent = formatTimer(state.timerRemainingSeconds);
      toggleTimerButton.textContent = state.timerRunning ? "PAUSE" : "START";
    }

    function syncTimerInputs() {
      minutesInput.value = state.timerConfigured ? Math.floor(state.timerInitialSeconds / 60) : "";
    }

    function openTimerModal() {
      syncTimerInputs();
      timerModalBackdrop.classList.add("open");
      setTimeout(() => minutesInput.focus(), 0);
    }

    function closeTimerModal() {
      timerModalBackdrop.classList.remove("open");
      openTimerModalButton.focus();
    }

    function stopTicking() {
      if (!tickIntervalId) return;
      clearInterval(tickIntervalId);
      tickIntervalId = null;
    }

    function getAudioContext() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return null;
      if (!audioContext) audioContext = new AudioCtx();
      if (audioContext.state === "suspended") audioContext.resume();
      return audioContext;
    }

    function playWhistleSound(durationMs) {
      try {
        whistleAudio.currentTime = 0;
        const playPromise = whistleAudio.play();
        if (playPromise && typeof playPromise.catch === "function") {
          playPromise.catch(() => {});
        }
        if (durationMs >= 1200) {
          setTimeout(() => {
            whistleAudio.currentTime = 0;
            whistleAudio.play().catch(() => {});
          }, 500);
        }
      } catch (_) {}

      const context = getAudioContext();
      if (!context) return;

      const now = context.currentTime;
      const durationSeconds = Math.max(0.2, durationMs / 1000);
      const oscillator = context.createOscillator();
      const gain = context.createGain();

      oscillator.type = "square";
      oscillator.frequency.setValueAtTime(2500, now);
      oscillator.frequency.exponentialRampToValueAtTime(2100, now + durationSeconds);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.08, now + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + durationSeconds);

      oscillator.connect(gain);
      gain.connect(context.destination);
      oscillator.start(now);
      oscillator.stop(now + durationSeconds);
    }

    function addPoints(team, points) {
      if (team === "home") {
        state.homeScore = Math.max(0, state.homeScore + points);
      } else {
        state.awayScore = Math.max(0, state.awayScore + points);
      }
      render();
      saveState();
    }

    function setTimer(totalSeconds) {
      const safeSeconds = Math.max(0, Math.floor(totalSeconds));
      state.timerInitialSeconds = safeSeconds;
      state.timerRemainingSeconds = safeSeconds;
      state.timerConfigured = safeSeconds > 0;
      state.timerRunning = false;
      state.timerEndAt = null;
      stopTicking();
      render();
      saveState();
    }

    function updateTimerFromClock() {
      if (!state.timerRunning || !state.timerEndAt) return;

      const nextRemaining = Math.max(0, Math.ceil((state.timerEndAt - Date.now()) / 1000));
      if (nextRemaining !== state.timerRemainingSeconds) {
        state.timerRemainingSeconds = nextRemaining;
        render();
        saveState();
      }

      if (nextRemaining === 0) {
        state.timerRunning = false;
        state.timerEndAt = null;
        stopTicking();
        playWhistleSound(1500);
        render();
        saveState();
      }
    }

    function startTimer() {
      if (!state.timerConfigured || state.timerInitialSeconds <= 0) {
        alert("Vui lòng SET thời gian trước khi START.");
        return;
      }
      if (state.timerRemainingSeconds <= 0) {
        state.timerRemainingSeconds = state.timerInitialSeconds;
      }

      state.timerRunning = true;
      state.timerEndAt = Date.now() + state.timerRemainingSeconds * 1000;
      stopTicking();
      tickIntervalId = setInterval(updateTimerFromClock, 250);
      render();
      saveState();
    }

    function pauseTimer() {
      if (!state.timerRunning) return;
      updateTimerFromClock();
      state.timerRunning = false;
      state.timerEndAt = null;
      stopTicking();
      render();
      saveState();
    }

    function resetTimer() {
      if (!state.timerConfigured) {
        setTimer(0);
        return;
      }
      state.timerRunning = false;
      state.timerEndAt = null;
      state.timerRemainingSeconds = state.timerInitialSeconds;
      stopTicking();
      render();
      saveState();
    }

    function hydrateRunningTimer() {
      if (!state.timerRunning || !state.timerEndAt) return;
      const recalculated = Math.max(0, Math.ceil((state.timerEndAt - Date.now()) / 1000));
      state.timerRemainingSeconds = recalculated;
      if (recalculated === 0) {
        state.timerRunning = false;
        state.timerEndAt = null;
        return;
      }
      tickIntervalId = setInterval(updateTimerFromClock, 250);
    }

    // Event handler: cập nhật tên đội nhà khi người dùng thay đổi input.
    homeNameInput.addEventListener("input", (event) => {
      state.homeName = sanitizeTeamName(event.target.value, "HOME");
      saveState();
    });

    // Event handler: cập nhật tên đội khách khi người dùng thay đổi input.
    awayNameInput.addEventListener("input", (event) => {
      state.awayName = sanitizeTeamName(event.target.value, "AWAY");
      saveState();
    });

    // Event handler: xử lý nút cộng điểm +1/+2/+3 cho từng đội.
    document.querySelectorAll(".score-actions .btn").forEach((button) => {
      button.addEventListener("click", () => {
        const points = Number(button.dataset.points || 0);
        const team = button.dataset.team;
        addPoints(team, points);
      });
    });

    // Event handler: nhận số phút từ UI và thiết lập mốc đếm ngược.
    setTimerButton.addEventListener("click", () => {
      const minutes = Math.max(0, Number(minutesInput.value) || 0);
      const cappedMinutes = Math.min(99, Math.floor(minutes));
      setTimer(cappedMinutes * 60);
      closeTimerModal();
    });

    // Event handler: mở popup để set thời gian trận đấu.
    openTimerModalButton.addEventListener("click", () => {
      openTimerModal();
    });

    // Event handler: đóng popup set timer khi bấm hủy.
    cancelTimerButton.addEventListener("click", () => {
      closeTimerModal();
    });

    // Event handler: đóng popup khi click ra nền tối bên ngoài.
    timerModalBackdrop.addEventListener("click", (event) => {
      if (event.target !== timerModalBackdrop) return;
      closeTimerModal();
    });

    // Event handler: hỗ trợ đóng popup set timer bằng phím Escape.
    window.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      if (!timerModalBackdrop.classList.contains("open")) return;
      closeTimerModal();
    });

    // Event handler: nhấn Enter trong modal sẽ lưu thời gian.
    timerModal.addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      event.preventDefault();
      setTimerButton.click();
    });

    // Event handler: bắt đầu hoặc tạm dừng đồng hồ thi đấu.
    toggleTimerButton.addEventListener("click", () => {
      if (state.timerRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    });

    // Event handler: reset đồng hồ về thời gian đã SET.
    resetTimerButton.addEventListener("click", () => {
      resetTimer();
    });

    // Event handler: Còi chạy - phát còi ngắn, đồng hồ vẫn tiếp tục chạy.
    whistlePlayButton.addEventListener("click", () => {
      playWhistleSound(500);
    });

    // Event handler: Còi điều khiển - phát còi và toggle trạng thái dừng/chạy của đồng hồ.
    whistleToggleButton.addEventListener("click", () => {
      playWhistleSound(500);
      if (state.timerRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    });

    // Event handler: khởi tạo audio context sớm để giảm độ trễ khi bấm còi.
    [whistlePlayButton, whistleToggleButton].forEach((button) => {
      button.addEventListener("pointerdown", () => {
        getAudioContext();
      });
    });

    // Event handler: reset toàn bộ điểm số về 0 sau khi xác nhận.
    resetScoreButton.addEventListener("click", () => {
      const confirmed = window.confirm("Bạn có chắc muốn reset điểm số về 0?");
      if (!confirmed) return;
      state.homeScore = 0;
      state.awayScore = 0;
      render();
      saveState();
    });

    loadState();
    hydrateRunningTimer();
    render();
  </script>
</body>
</html>
